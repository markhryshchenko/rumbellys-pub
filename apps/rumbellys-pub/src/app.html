<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Engine: no double-tap / pinch zoom on mobile (touch-action below covers iOS, which ignores user-scalable) -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		%sveltekit.head%
	</head>
	<body
		style="margin: 0; padding: 0; overflow: hidden; background-color: black; touch-action: manipulation"
	>
		<div>%sveltekit.body%</div>
	</body>
</html>
